# Nothing — glyph light on transparent black
# Monochrome ground, one red signal. Hues survive only far enough
# to keep syntax legible; at a glance the screen reads grey.

mode                     = "dark"

# Signal, selection and the de-emphasised ramp
accent                   = "#d71921"
selection                = "#2a2a2a"
muted                    = "#6e6e6e"

# Ground, from the deepest surface up to the elevated one
background               = "#0a0a0a"
dark_background          = "#050505"
darker_background        = "#000000"
lighter_background       = "#161616"

# Text, from de-emphasised up to the cursor
foreground               = "#ededed"
dark_foreground          = "#5c5c5c"
light_foreground         = "#b4b4b4"
bright_foreground        = "#ffffff"

# Window borders. Also drives the shell's border tokens.
hyprland_active_border   = "rgba(d71921ee) rgba(ff3b42ee) 45deg"
hyprland_inactive_border = "rgba(2a2a2aaa)"

# Named colours — saturation pulled down hard, red left intact
red                      = "#d71921"
yellow                   = "#a89f84"
orange                   = "#b8846a"
green                    = "#7a8a72"
cyan                     = "#7e9694"
blue                     = "#7e8896"
magenta                  = "#97869a"
brown                    = "#6b5f52"

# Bright variants
bright_red               = "#ff3b42"
bright_yellow            = "#c8bea0"
bright_green             = "#98a88f"
bright_cyan              = "#9bb3b1"
bright_blue              = "#9ba5b3"
bright_magenta           = "#b3a2b6"
